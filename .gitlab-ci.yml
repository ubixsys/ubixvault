# GitLab pipeline for uBixVault. It mirrors .github/workflows/ci.yml so a merge request is
# tested on GitLab before it merges, not only on the GitHub mirror afterwards.
#
# The instance runner is a shell executor with Docker (the same one ubixshepherd uses), so
# jobs take the `shell` tag and run their commands in official images with `docker run`,
# as the runner's uid, with the Go build and module caches under the runner's home.
# GitLab `services:` needs the Docker executor, so the integration job starts MariaDB
# itself on a per-job network.
#
# Stays on GitHub only: ha-e2e.yml (a three-replica kind cluster) and image.yml.

# Kelpie's advisory AI review on merge requests (job `kelpie-review`, stage `test`). Pinned
# to a ubixkelpie commit, not a branch, so its job cannot change this CI unreviewed; move it
# to a release tag once one carries ci/kelpie.yml (the only tag predates it). Needs group
# variables KELPIE_REGISTRY_USER / KELPIE_REGISTRY_TOKEN (read_registry, to pull Kelpie's
# image), plus OPENROUTER_API_KEY and AI_REVIEW_GITLAB_TOKEN; until they exist the job exits
# 75, is allowed to fail and the pipeline stays green. It runs only on merge request
# pipelines into AI_REVIEW_BASE_BRANCH.
include:
  - project: ubixsys/ubixkelpie
    ref: 788c9416214a6bdf4ceaffd851eaf34ac7850a38
    file: ci/kelpie.yml
  # The merge sign-off gate: an Approve or a thumbs-up from an owner before merge
  # (ubixcore docs/ci-require-approval.md). Runs in .post, after the checks below. Kelpie's
  # prod webhook retries it the moment someone signs off. Pinned to the uBixCore commit that
  # last changed the include, the same pin as replikate: no release ships it yet (v0.47.0
  # predates it). Switch to the first v* tag that contains it once there is one.
  - project: ubixsys/ubixcore
    ref: aaa3fb5f0272a8eeb6aa7debac0bf46d718402b4
    file: ci/require-approval.yml

stages: [test]

# Merge request pipelines (what "Pipelines must succeed" judges) and pushes to the default
# branch. A push to an MR's branch starts no extra branch pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  tags: [shell]
  interruptible: true

variables:
  AI_REVIEW_BASE_BRANCH: main
  UBIX_APPROVAL_OWNERS: "cwolsen"                 # whose Approve/thumbs-up counts, incl. on their own MR
  GO_IMAGE: golang:1.26                         # go.mod needs >= 1.25.0; GitHub CI tests on 1.26
  LINT_IMAGE: golangci/golangci-lint:v2.12.2    # same version as GitHub
  MARIADB_IMAGE: mariadb:11

.go:
  before_script:
    - mkdir -p "$HOME/.cache/ubixvault-go"
    # go_run '<bash command>': runs it in the Go image in the checkout. Extra `docker run`
    # arguments can be passed in GO_RUN_ARGS.
    - |
      go_run() {
        docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
          -v "$HOME/.cache/ubixvault-go:/cache" \
          -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod -e GOFLAGS=-buildvcs=false \
          -e GOBIN=/cache/bin $GO_RUN_ARGS \
          "${GO_IMAGE_OVERRIDE:-$GO_IMAGE}" bash -c "set -euo pipefail; $1"
      }

build-test:
  extends: .go
  stage: test
  script:
    - |
      go_run '
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
        go version
        go vet ./...
        go test -race -covermode=atomic -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -n 1
        go build ./...
        go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml
      '
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [coverage.out]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint:
  stage: test
  before_script:
    - mkdir -p "$HOME/.cache/ubixvault-go/lint"
  script:
    - |
      docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
        -v "$HOME/.cache/ubixvault-go:/cache" \
        -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod \
        -e GOFLAGS=-buildvcs=false -e GOLANGCI_LINT_CACHE=/cache/lint \
        "$LINT_IMAGE" golangci-lint run

# govulncheck follows the latest vulnerability database, so this job can go red with no
# code change. The report is kept as an artifact (D-023 records the Raft result from it).
vuln:
  extends: .go
  stage: test
  script:
    - |
      go_run '
        go install golang.org/x/vuln/cmd/govulncheck@latest
        /cache/bin/govulncheck ./... 2>&1 | tee govulncheck.txt
      '
  artifacts:
    when: always
    expire_in: 4 weeks
    paths: [govulncheck.txt]

integration:
  extends: .go
  stage: test
  variables:
    NET: ubixvault-it-$CI_JOB_ID
    DB: ubixvault-mariadb-$CI_JOB_ID
  script:
    - docker network create "$NET"
    - |
      docker run -d --name "$DB" --network "$NET" --network-alias mariadb \
        -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=testdb "$MARIADB_IMAGE"
    - |
      for i in $(seq 1 60); do
        docker exec "$DB" healthcheck.sh --connect --innodb_initialized && break
        if [ "$i" = 60 ]; then echo "MariaDB did not become healthy"; docker logs "$DB"; exit 1; fi
        sleep 2
      done
    - |
      GO_RUN_ARGS="--network $NET -e UBIXVAULT_MARIADB_DSN=root:root@tcp(mariadb:3306)/testdb?parseTime=true" \
        go_run 'go test -tags integration ./internal/database/... ./internal/storage/...'
  after_script:
    - docker rm -f "ubixvault-mariadb-$CI_JOB_ID" || true
    - docker network rm "ubixvault-it-$CI_JOB_ID" || true

# test/e2e/console/run.sh needs Go, Node >= 22 and Chrome, and no one image has all three,
# so the server is built in the Go image and the browser test runs in an image with Chrome
# (the Puppeteer one: Node plus Chrome). The image does not export a Chrome path to a job's
# user, so it runs as root, finds the Chrome the image ships, and hands the output back to
# the runner's uid. The steps are those of run.sh.
console-e2e:
  extends: .go
  stage: test
  variables:
    CHROME_IMAGE: ghcr.io/puppeteer/puppeteer:latest
  script:
    - mkdir -p console-e2e-out
    - go_run 'CGO_ENABLED=0 go build -o console-e2e-out/ubixvault ./cmd/ubixvault'
    - |
      docker run --rm -v "$PWD:/src" -w /src --user root \
        -e HOME=/tmp -e CI=true -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        "$CHROME_IMAGE" bash -c '
          set -euo pipefail
          out=console-e2e-out; port=18200
          mkdir -p "$out/screenshots"
          CHROME_BIN="${PUPPETEER_EXECUTABLE_PATH:-}"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(find / -type f -path "*/chrome-linux*/chrome" 2>/dev/null | head -n 1)"
          fi
          [ -x "$CHROME_BIN" ] || { echo "no Chrome in the image"; exit 1; }
          export CHROME_BIN
          echo "chrome: $CHROME_BIN"
          ./$out/ubixvault server -listen "127.0.0.1:$port" -data /tmp/vault-data >"$out/server.log" 2>&1 &
          trap "kill $! 2>/dev/null || true; chown -R $HOST_UID:$HOST_GID $out" EXIT
          for _ in $(seq 1 100); do
            curl -s -o /dev/null "http://127.0.0.1:$port/v1/sys/seal-status" && break
            sleep 0.1
          done
          node test/e2e/console/console-e2e.mjs "http://127.0.0.1:$port" "$out/screenshots"
        '
  artifacts:
    when: always
    expire_in: 1 week
    paths: [console-e2e-out/screenshots, console-e2e-out/server.log]

# The repo is public and mirrored, so nothing private may be committed. The pattern of
# private names lives in the PUBLIC_BOUNDARY_PATTERN CI variable (project settings, not the
# repo, so the list itself is not published). It scans the tracked files of the commit
# (`git grep`), not artifacts or caches the job happens to have in its workspace. In a merge
# request pipeline it also scans the MR's own commits, base..head: lines added or removed in
# each diff (`git log -G`, so a name added and then removed within the MR is caught) and the
# commit messages. Older history is out of scope. It prints file:line or a commit sha only,
# never the matched text, and fails closed on any git error (exit 128: a bad pattern, or a
# base commit it cannot read); stderr is discarded so a malformed pattern cannot be echoed
# into the log. Full clone (GIT_DEPTH 0) so the MR's base is always present.
public-boundary:
  stage: test
  tags: [shell]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ -z "${PUBLIC_BOUNDARY_PATTERN:-}" ]; then
        echo "PUBLIC_BOUNDARY_PATTERN is not set in CI/CD variables; refusing to pass unchecked."
        exit 1
      fi
      out="$(mktemp)"
      trap 'rm -f "$out"' EXIT
      found=0
      # GitLab runs this under `set -eo pipefail`; `|| rc=$?` keeps git grep's exit 1 (no
      # match, the clean case) from aborting the job before the status is read.
      rc=0
      git grep -niE -e "$PUBLIC_BOUNDARY_PATTERN" > "$out" 2>/dev/null || rc=$?
      if [ "$rc" -gt 1 ]; then
        echo "git grep failed with exit $rc; refusing to pass unchecked."
        exit 1
      fi
      if [ "$rc" -eq 0 ]; then
        echo "Private names found in tracked files (file:line):"
        cut -d: -f1,2 "$out"
        found=1
      fi
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -n "$base" ]; then
        # git log exits 0 whether or not anything matched; a hit is any sha printed.
        for kind in diff message; do
          case "$kind" in
            diff)    flag=-G ;;
            message) flag=--grep ;;
          esac
          rc=0
          git log -i -E "$flag" "$PUBLIC_BOUNDARY_PATTERN" --format=%h "$base..HEAD" > "$out" 2>/dev/null || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "git log ($kind) failed with exit $rc over $base..HEAD; refusing to pass unchecked."
            exit 1
          fi
          if [ -s "$out" ]; then
            echo "Private names found in this merge request's commit ${kind}s (commit):"
            cat "$out"
            found=1
          fi
        done
      fi
      if [ "$found" -ne 0 ]; then
        exit 1
      fi
      if [ -n "$base" ]; then
        echo "Public boundary clean: tracked files and the merge request's commits."
      else
        echo "Public boundary clean: tracked files."
      fi

# The sign-off job from the include above. It runs in an alpine image (curl, jq), so it goes
# to the instance's k8s runner, which takes tagged jobs only and honours each job's image;
# the shell runner would ignore the image. Reads approvals with the group's
# AI_REVIEW_GITLAB_TOKEN. The shared script passes as UNVERIFIED (exit 0) when it has no
# token or cannot read the approvals (GitLab unreachable, an error, an unreadable answer). A
# secrets manager's gate fails closed (CONTRIBUTING), so before_script refuses to start
# without a token, and wraps `bash` (the shared script ends with `bash "$SCRIPT"`) so that a
# run reporting UNVERIFIED fails the job. Drop the wrapper once uBixCore's
# ci/bin/require-approval.sh has a fail-closed option.
require-approval:
  tags: [k8s]
  before_script:
    - '[ -n "${APPROVAL_GITLAB_TOKEN:-${AI_REVIEW_GITLAB_TOKEN:-}}" ] || { echo "require-approval: FAILED: no APPROVAL_GITLAB_TOKEN or AI_REVIEW_GITLAB_TOKEN, so the sign-off cannot be checked; failing closed."; exit 1; }'
    - command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null
    - |
      bash() {
        out="$(command bash "$@")" && rc=0 || rc=$?
        printf '%s\n' "$out"
        case "$out" in *UNVERIFIED*)
          echo "require-approval: FAILED: the sign-off could not be verified; failing closed. Retry the job."; return 1 ;;
        esac
        return "$rc"
      }
