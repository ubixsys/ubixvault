<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>uBixVault</title>
  <rect width="32" height="32" fill="#0f62fe"/>
  <!-- Four key shares, one faint, around a seal: a threshold of shares unseals the vault. -->
  <rect x="6" y="6" width="9" height="9" fill="#ffffff"/>
    <rect x="17" y="6" width="9" height="9" fill="#ffffff"/>
    <rect x="6" y="17" width="9" height="9" fill="#ffffff"/>
    <rect x="17" y="17" width="9" height="9" fill="#ffffff" opacity="0.55"/>
    <circle cx="16" cy="16" r="4" fill="#0f62fe"/>
    <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>
